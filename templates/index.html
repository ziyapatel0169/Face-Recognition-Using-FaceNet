
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #9ca3af;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        video {
            width: 100%;
            border-radius: 10px;
            background: black;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            margin: 8px 5px 0 0;
            font-weight: bold;
        }

        .start {
            background: #16a34a;
            color: white;
        }

        .stop {
            background: #dc2626;
            color: white;
        }

        .person {
            padding: 12px;
            background: #334155;
            border-radius: 7px;
            margin-top: 10px;
        }

        #result {
            margin-top: 15px;
            font-size: 22px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #475569;
        }

        @media(max-width: 750px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Face Recognition Dashboard</h1>
    <p class="subtitle">AI Powered Face Recognition System</p>

    <div class="dashboard">

        <div>
            <div class="card">
                <h2>Live Camera</h2>

                <video id="camera" autoplay playsinline></video>

                <canvas id="canvas" hidden></canvas>

                <div>
                    <button class="start" onclick="startCamera()">
                        Start Camera
                    </button>

                    <button class="stop" onclick="stopCamera()">
                        Stop Camera
                    </button>
                </div>

                <div id="result">Waiting for camera...</div>
            </div>

            <div class="card">
                <h2>Recognition History</h2>

                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Time</th>
                        </tr>
                    </thead>

                    <tbody id="history">
                    </tbody>
                </table>
            </div>
        </div>

        <div>
            <div class="card">
                <h2>Registered People</h2>
                <div id="people">Loading...</div>
            </div>

            <div class="card">
                <h2>System Information</h2>
                <p>Model: FaceNet</p>
                <p>Registered Classes: 4</p>
                <p>Feature Size: 512</p>
                <p>Unknown Detection: Enabled (provisional threshold)</p>
            </div>
        </div>

    </div>

<script>

let stream = null;
let timer = null;
let busy = false;

const video = document.getElementById("camera");
const canvas = document.getElementById("canvas");

async function startCamera() {

    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: true
        });

        video.srcObject = stream;

        timer = setInterval(captureFrame, 1200);

    } catch (error) {
        alert("Camera permission denied or unavailable.");
    }
}

function stopCamera() {

    if (timer) clearInterval(timer);

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }

    video.srcObject = null;
    stream = null;
    document.getElementById("result").innerText = "Camera stopped";
}

async function captureFrame() {

    if (busy || !stream || video.readyState < 2) return;

    busy = true;

    try {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        canvas.getContext("2d").drawImage(
            video, 0, 0, canvas.width, canvas.height
        );

        const image = canvas.toDataURL("image/jpeg", 0.8);

        const response = await fetch("/recognize", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({image: image})
        });

        const data = await response.json();

        if (data.error) {
            document.getElementById("result").innerText = data.error;
            return;
        }

        document.getElementById("result").innerText =
            data.name + " | " + data.status;

        loadHistory();

    } catch (error) {
        console.error(error);
    } finally {
        busy = false;
    }
}

async function loadPeople() {

    const response = await fetch("/people");
    const people = await response.json();

    document.getElementById("people").innerHTML =
        people.map(person =>
            `<div class="person">${person}</div>`
        ).join("");
}

async function loadHistory() {

    const response = await fetch("/history");
    const records = await response.json();

    document.getElementById("history").innerHTML =
        records.map(record => `
            <tr>
                <td>${record.name}</td>
                <td>${record.status}</td>
                <td>${record.time}</td>
            </tr>
        `).join("");
}

loadPeople();
loadHistory();
// Clear history when dashboard is closed
window.addEventListener("pagehide", function() {

    navigator.sendBeacon("/clear-history");

});

</script>

</body>
</html>
